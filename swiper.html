<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiper</title>
    <!-- <link real="stylesheet" href="css/slick.css"> -->
    <!-- <link rel="stylesheet" type="text/css" href="css/slick-theme.css" /> -->
    <!-- <link real="stylesheet" href="css/slider.css"> -->
    <!-- Add the slick-theme.css if you want default styling -->
    <link rel="stylesheet" type="text/css" href="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
    <!-- Add the slick-theme.css if you want default styling -->
    <link rel="stylesheet" type="text/css" href="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css" />
    <link rel="stylesheet" href="css/slider.css">

<body>

    <section id="secta">
        <div class="InnerBlock">
            <div class="firstSwiper">
                <div class="firstSwiper-element" style="background-color:rgb(15, 189, 125);"></div>
                <div class="firstSwiper-element" style="background-color:red;"></div>
                <div class="firstSwiper-element" style="background-color:rgb(8, 62, 37);"></div>
                <div class="firstSwiper-element" style="background-color:rgb(22, 36, 74);"></div>
                <div class="firstSwiper-element" style="background-color:rgb(105, 17, 30);"></div>
                <div class="firstSwiper-element" style="background-color:rgb(0, 0, 0);"></div>

            </div>

            <div class="swiper-tagdescription">
                <div class="swiper-tagdescription-items">
                    <div class="tags">
                        <p>Цена включает:</p>
                        <div class="tags-text">
                            <p><img src="content/tags/1.Plane.svg">Перелёт</p>
                            <p><img src="content/tags/2.Transfer.svg">Трансфер</p>
                            <p><img src="content/tags/3.Residence.svg">Проживание</p>
                            <p><img src="content/tags/4.Food.svg">Питание согласно концепции отеля</p>
                            <p><img src="content/tags/5.Medical insurance.svg">Медицинскую страховку</p>
                        </div>
                    </div>

                    <div class="hotprice">
                        <img src="content/hot-price!.svg" />
                    </div>
                </div>
            </div>

            <div class="secondSwiper">
                <p class="countryNames">Name1</p>
                <p class="countryNames">Name2</p>
                <p class="countryNames">Name3</p>
                <p class="countryNames">Виргинские Острова (Великобритания)</p>
                <p class="countryNames">Американское Самоа</p>
                <p class="countryNames">Азорские острова</p>
                <p class="countryNames">Name7</p>
                <p class="countryNames">Name8</p>
                <p class="countryNames">Name9</p>
                <p class="countryNames">Name10</p>
                <p class="countryNames">Name11</p>
                <p class="countryNames">Name12</p>
                <p class="countryNames">Хургада</p>
                <p class="countryNames">Новая Зеландия</p>

            </div>
        </div>
    </section>


    <script type="text/javascript" src="//code.jquery.com/jquery-1.11.0.min.js"></script>
    <script type="text/javascript" src="//code.jquery.com/jquery-migrate-1.2.1.min.js"></script>
    <script type="text/javascript" src="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script src="js/swiper.js"></script>


    <!-- <script type="text/javascript" src="js/swiper.js"></script> -->
</body>

</html>
