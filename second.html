<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>

    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            background: #eee;
            font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
            font-size: 14px;
            color: #000;
            height: 100vh;
            padding: 300px;
        }

        swiper-container {
            width: 100%;
            height: 100%;
        }

        swiper-slide {
            text-align: center;
            font-size: 18px;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        swiper-slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .swiper-v {
            background: #eee;
        }

        .columnsW {
            position: relative;
            height: 100%;
            display: flex;
            grid-template-columns: 50% 50%;
        }

        .columnsW>div {
            height: fit-content;
        }
    </style>
</head>

<body>

    <div class="columnsW">

        <div>hihihihi</div>

        <swiper-container class="mySwiper swiper-h" pagination="true" pagination-clickable="true" space-between="50">
            <swiper-slide>Horizontal Slide 1</swiper-slide>
            <swiper-slide>
                <swiper-container class="mySwiper2 swiper-v" pagination="true" pagination-clickable="true"
                    space-between="50" direction="vertical">
                    <swiper-slide>Vertical Slide 1</swiper-slide>
                    <swiper-slide>Vertical Slide 2</swiper-slide>
                    <swiper-slide>Vertical Slide 3</swiper-slide>
                    <swiper-slide>Vertical Slide 4</swiper-slide>
                    <swiper-slide>Vertical Slide 5</swiper-slide>
                </swiper-container>
            </swiper-slide>
            <swiper-slide>Horizontal Slide 3</swiper-slide>
            <swiper-slide>Horizontal Slide 4</swiper-slide>
        </swiper-container>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-element-bundle.min.js"></script>

</body>

</html>
